# Layer 1: reach through workflow_run -> org_id, same pattern as steps/
# triggers. No insert/update/delete permissions for any user role -- step_runs
# is only ever written by the shared executor (lib/workflow-executor.ts) via
# the admin client, invoked from the Action handlers. The `approveStep`
# Action is the ONLY sanctioned way to flip a paused step_run forward, and it
# re-checks the caller's role server-side (Layer 2) before doing so.
table:
  schema: public
  name: step_runs
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: owner
    permission:
      columns: [id, workflow_run_id, workflow_step_id, step_order, status, input, output, error, approved_by, approved_at, started_at, completed_at]
      filter:
        workflow_run: { org_id: { _eq: X-Hasura-Org-Id } }
  - role: editor
    permission:
      columns: [id, workflow_run_id, workflow_step_id, step_order, status, input, output, error, approved_by, approved_at, started_at, completed_at]
      filter:
        workflow_run: { org_id: { _eq: X-Hasura-Org-Id } }
  - role: viewer
    permission:
      columns: [id, workflow_run_id, workflow_step_id, step_order, status, input, output, error, approved_by, approved_at, started_at, completed_at]
      filter:
        workflow_run: { org_id: { _eq: X-Hasura-Org-Id } }
